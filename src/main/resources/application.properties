# ---------------------------------------------------------------
# Application Configuration
# ---------------------------------------------------------------

# Application name (shows up in Actuator /info and logs)
spring.application.name=k8s-task-tracker

# Server port — 8080 is the conventional default for containerized apps
server.port=8080

# ---------------------------------------------------------------
# Actuator Configuration
# ---------------------------------------------------------------
# Expose only the health endpoint over HTTP.
# In Kubernetes, /actuator/health is used for liveness and readiness probes.
management.endpoints.web.exposure.include=health

# Show full health details (useful during development; in production you may
# set this to "never" or "when-authorized")
management.endpoint.health.show-details=always
